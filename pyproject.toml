[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires docker-compose services (redis/postgres)",
    "e2e: requires real OPENROUTER_API_KEY and MARITIME_API_KEY",
]
filterwarnings = [
    # tests/conftest.py must set WindowsSelectorEventLoopPolicy because psycopg3
    # async refuses ProactorEventLoop (Python 3.14's Windows default). Both policy
    # APIs are deprecated in 3.14 (removal slated for 3.16); ignore only these
    # two exact messages until pytest-asyncio offers a loop_factory hook.
    "ignore:'asyncio\\.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning",
    "ignore:'asyncio\\.set_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100